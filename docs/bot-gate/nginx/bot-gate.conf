# Bot gate — 2026-09-15. Pairs with the Turnstile middleware in the Next app.
# Install as /etc/nginx/conf.d/bot-gate.conf (see ../apply-bot-gate.sh).

# 1. Network block: whole ASNs that only ever sent scraper traffic.
#    blocked-prefixes.conf = every IPv4 prefix Tencent Cloud (AS132203)
#    announces. Regenerate from
#    https://stat.ripe.net/data/announced-prefixes/data.json?resource=AS132203
geo $block_asn {
    default 0;
    include /etc/nginx/conf.d/blocked-prefixes.conf;
}

# 2. Scraper user agents that never carry legitimate traffic here.
map $http_user_agent $block_ua {
    default 0;
    ~*(Bytespider|Sogou\ web\ spider|MJ12bot|PetalBot|python-requests|Go-http-client|scrapy|Java/|libwww-perl|okhttp) 1;
}

# 3. Rate limiting per client IP. Our own box (cache warmer) is exempt.
map $remote_addr $rl_key {
    127.0.0.1   "";
    52.2.135.6  "";
    default     $binary_remote_addr;
}
limit_req_zone $rl_key zone=rl_pages:20m rate=10r/s;
limit_req_zone $rl_key zone=rl_api:20m   rate=30r/s;
limit_conn_zone $rl_key zone=rl_conn:20m;
limit_req_status 429;
limit_conn_status 429;

# 4. Visitors without the verification cookie must reach Next (the middleware
#    answers them), never a cached copy — and their responses must not be
#    cached. Without this the HTML cache would store the interstitial under the
#    real page URL and serve it to verified visitors for 60s.
map $cookie_ib_verified $no_verified {
    ""      1;
    default 0;
}
