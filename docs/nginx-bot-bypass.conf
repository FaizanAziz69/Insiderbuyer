# /etc/nginx/conf.d/bot-bypass.conf  (applied 2026-09-10)
#
# Link-preview and search bots must reach Next.js directly. Next 15 streams
# page metadata into the <body> on dynamically rendered pages and only places
# it in <head> for user agents in its HTML-limited-bot list (plus
# next.config.js `htmlLimitedBots`). WhatsApp reads <head> only, so a browser's
# cached HTML copy handed to it has no og:image (the Thiel story, 2026-09-10).
# The map below feeds `proxy_cache_bypass` / `proxy_no_cache` in the htmlcache
# `location /` of sites-available/insider:
#
#     proxy_cache_bypass $http_authorization $bypass_bot;
#     proxy_no_cache     $http_authorization $bypass_bot;
map $http_user_agent $bypass_bot {
    default 0;
    ~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|LinkedInBot|Slackbot|Discordbot|TelegramBot|SkypeUriPreview|Applebot|iMessage|Googlebot|bingbot|DuckDuckBot|redditbot|Pinterest|Embedly|vkShare|Snapchat|Viber) 1;
}
