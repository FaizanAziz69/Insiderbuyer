# nginx: let a CDN cache HTML at the edge (2026-09-14)
#
# Replaces the final two lines of the `location /` block in
# sites-available/insider:
#
#     proxy_hide_header Cache-Control;
#     add_header Cache-Control "public, max-age=0, must-revalidate" always;
#
# WHY the old value existed: this box WAS the CDN. Next sends
# `s-maxage=120, stale-while-revalidate=31535880` on prerendered HTML and no
# max-age at all, so a browser cached it heuristically and kept rendering a
# build we had already replaced (caught 2026-09-11 — a plain reload still
# showed the previous markup).
#
# WHY it changes: with CloudFront in front, this box is no longer the edge.
# `max-age=0, must-revalidate` applies to every cache including the CDN, so
# CloudFront would forward every single page view to Virginia and the CDN
# would buy us nothing but a TLS handshake.
#
# The browser half is unchanged — `max-age=0, must-revalidate` still forces a
# conditional request per view, so the 2026-09-11 fix still holds. `s-maxage`
# is read ONLY by shared caches, so the edge serves the page for 60s and
# revalidates in the background for 10 minutes after that.
proxy_hide_header Cache-Control;
add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=60, stale-while-revalidate=600" always;
