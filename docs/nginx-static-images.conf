# nginx: serve the app's own static images from disk (2026-08-24)
#
# WHY: /public images were falling through to `location /`, i.e. every card
# image went browser -> nginx -> node (next start) -> disk, and Next serves
# /public with `Cache-Control: max-age=0`. Measured on production before this
# change: TTFB 1.06-1.31s per image, `X-Cache-Status: MISS`, and no browser
# caching at all, so the same 350KB file was re-fetched on every page view.
# The home page renders client-side, so those seconds are exactly the blank
# grey boxes users see where the story covers should be.
#
# AFTER: nginx reads the file itself (no proxy hop, ~5ms) and sets a 30-day
# cache, so a repeat view costs zero requests.
#
# Paste these blocks into /etc/nginx/sites-available/insider INSIDE the
# `server { ... }` block that serves insiderbuying.com, immediately BEFORE
# `location /_next/static/ {`, then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# Keep this file in sync by hand — the server config is not in the repo.

  location ~* ^/(editorial-thumbs|sales|investors|sounds)/ {
    root /opt/insider/app/frontend/public;
    access_log off;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # Top-level assets (og-image.png, the wordmark logos, favicons). Falls back
  # to the app when the file is not on disk, so nothing 404s that used to work.
  location ~* ^/[^/]+\.(png|jpg|jpeg|svg|ico|webp|avif)$ {
    root /opt/insider/app/frontend/public;
    access_log off;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri @nextapp;
  }

  location @nextapp {
    proxy_pass http://next_up;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
