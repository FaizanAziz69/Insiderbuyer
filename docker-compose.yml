services:
  postgres:
    image: postgres:16-alpine
    container_name: iqs_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: iqs_user
      POSTGRES_PASSWORD: iqs_password
      POSTGRES_DB: iqs_db
    ports:
      - "5432:5432"
    volumes:
      - iqs_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iqs_user -d iqs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  iqs_data:
